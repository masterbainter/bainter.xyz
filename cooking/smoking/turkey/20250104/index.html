<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dakota Smoke: Turkey Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bitter:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-serif {
            font-family: 'Bitter', serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons (Replaces lucide-react for single-file portability) ---
        const IconBase = ({ children, className }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const Flame = ({ className }) => (
            <IconBase className={className}>
                <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.1.2-2.2.6-3.3a1 1 0 0 0 .9 2.8Z" />
            </IconBase>
        );

        const ChefHat = ({ className }) => (
            <IconBase className={className}>
                <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z" />
                <line x1="6" y1="17" x2="18" y2="17" />
            </IconBase>
        );

        const Thermometer = ({ className }) => (
            <IconBase className={className}>
                <path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z" />
            </IconBase>
        );

        const Wind = ({ className }) => (
            <IconBase className={className}>
                <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2" />
                <path d="M9.6 4.6A2 2 0 1 1 11 8H2" />
                <path d="M12.6 19.4A2 2 0 1 0 14 16H2" />
            </IconBase>
        );

        const Mountain = ({ className }) => (
            <IconBase className={className}>
                <path d="m8 3 4 8 5-5 5 15H2L8 3z" />
            </IconBase>
        );

        const Trash2 = ({ className }) => (
            <IconBase className={className}>
                <path d="M3 6h18" />
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                <line x1="10" y1="11" x2="10" y2="17" />
                <line x1="14" y1="11" x2="14" y2="17" />
            </IconBase>
        );

        const CheckCircle2 = ({ className }) => (
            <IconBase className={className}>
                <circle cx="12" cy="12" r="10" />
                <path d="m9 12 2 2 4-4" />
            </IconBase>
        );

        const Circle = ({ className }) => (
            <IconBase className={className}>
                <circle cx="12" cy="12" r="10" />
            </IconBase>
        );

        const Utensils = ({ className }) => (
            <IconBase className={className}>
                <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
                <path d="M7 2v20" />
                <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" />
            </IconBase>
        );

         const Edit3 = ({ className }) => (
            <IconBase className={className}>
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </IconBase>
        );

        const ShoppingBag = ({ className }) => (
            <IconBase className={className}>
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                <path d="M3 6h18" />
                <path d="M16 10a4 4 0 0 1-8 0" />
            </IconBase>
        );


        const DakotaSmokeApp = () => {
          // --- State Management ---
          const [activeTab, setActiveTab] = useState('guide');
          const [progress, setProgress] = useState(0);
          
          // Icon mapping to keep state serializable (JSON friendly)
          // Using functions here to render the components defined above
          const iconMap = {
            chef: <ChefHat className="w-6 h-6" />,
            flame: <Flame className="w-6 h-6" />,
            thermometer: <Thermometer className="w-6 h-6" />,
            wind: <Wind className="w-6 h-6" />,
            bag: <ShoppingBag className="w-6 h-6" />
          };

          // Initial Data Structure - using string keys for icons instead of components
          const initialSteps = [
            {
              id: 0,
              title: "The Provisions",
              subtitle: "Gathering Supplies",
              iconKey: "bag",
              color: "from-sky-600 to-blue-700",
              tasks: [
                { id: 'b1', text: "Oranges", completed: false },
                { id: 'b2', text: "Apples", completed: false },
                { id: 'b3', text: "Lemons (Already Purchased)", completed: true },
                { id: 'b4', text: "Onion (Already Purchased)", completed: true },
                { id: 'b5', text: "Turkey Tin / Pan", completed: false },
                { id: 'b6', text: "Bags of ice", completed: false },
                { id: 'b7', text: "Bay leaves", completed: false },
                { id: 'b8', text: "Thyme", completed: false },
                { id: 'b9', text: "Rosemary", completed: false },
                { id: 'b10', text: "Garlic", completed: false }
              ],
              note: ""
            },
            {
              id: 1,
              title: "The Prep",
              subtitle: "Counter Setup",
              iconKey: "chef",
              color: "from-amber-600 to-orange-700",
              tasks: [
                { id: 'p1', text: "Mix Rub: 1/2 cup Tone's Italian + 2 tbsp Sea Salt", completed: false },
                { id: 'p2', text: "Pat turkey skin completely dry with paper towels", completed: false },
                { id: 'p3', text: "Coat bird lightly with Colavita Olive Oil (Binder)", completed: false },
                { id: 'p4', text: "Apply Rub mixture generously over entire bird", completed: false },
                { id: 'p5', text: "Let sit at room temp while prepping grill", completed: false }
              ],
              note: ""
            },
            {
              id: 2,
              title: "The Setup",
              subtitle: "Traeger Century 885",
              iconKey: "flame",
              color: "from-stone-700 to-stone-900",
              tasks: [
                { id: 's1', text: "Fill Hopper: Fruit (Cherry/Apple) or Hickory pellets", completed: false },
                { id: 's2', text: "Place empty roasting pan UNDER the grill grates", completed: false },
                { id: 's3', text: "Place turkey DIRECTLY on the grill grates", completed: false },
                { id: 's4', text: "Insert probe into thickest part of breast", completed: false }
              ],
              note: ""
            },
            {
              id: 3,
              title: "The Cook",
              subtitle: "13lb Bird Estimate: ~3.5 - 4 Hrs Total",
              iconKey: "thermometer",
              color: "from-red-700 to-red-900",
              tasks: [
                { id: 'c1', text: "Set Traeger to 225°F (Super Smoke if avail)", completed: false },
                { id: 'c2', text: "SMOKE: Cook for 1 hour exactly (Max flavor absorption)", completed: false, hasTimer: true, duration: 3600 },
                { id: 'c3', text: "Increase Temp: Crank heat to 350°F - 375°F", completed: false },
                { id: 'c4', text: "ROAST: Cook to 160°F internal (Approx 2.5 - 3 more hrs)", completed: false },
              ],
              note: ""
            },
            {
              id: 4,
              title: "The Rest",
              subtitle: "Patience Pays Off",
              iconKey: "wind",
              color: "from-emerald-700 to-emerald-900",
              tasks: [
                { id: 'r1', text: "Remove bird, place on board/pan", completed: false },
                { id: 'r2', text: "Tent loosely with foil", completed: false },
                { id: 'r3', text: "REST: Wait at least 30 minutes before carving", completed: false, hasTimer: true, duration: 1800 },
                { id: 'r4', text: "Carve and Serve", completed: false }
              ],
              note: ""
            }
          ];

          const [steps, setSteps] = useState(initialSteps);

          // --- Effects ---
          
          // Load from local storage on mount
          useEffect(() => {
            try {
              const savedData = localStorage.getItem('dakotaSmokeData');
              if (savedData) {
                let parsedData = JSON.parse(savedData);
                
                // Basic validation and Migration for new items
                if (Array.isArray(parsedData)) {
                   // Check if the new "Provisions" step exists, if not, add it
                   const hasProvisions = parsedData.some(step => step.title === "The Provisions");
                   if (!hasProvisions) {
                       parsedData = [initialSteps[0], ...parsedData];
                   }
                   setSteps(parsedData);
                } else {
                   // If data format is old/invalid, clear it to be safe
                   localStorage.removeItem('dakotaSmokeData');
                }
              }
            } catch (e) {
              console.error("Failed to load data", e);
              localStorage.removeItem('dakotaSmokeData');
            }
          }, []);

          // Save to local storage on change
          useEffect(() => {
            try {
              localStorage.setItem('dakotaSmokeData', JSON.stringify(steps));
              calculateProgress();
            } catch (e) {
              console.error("Failed to save progress", e);
            }
          }, [steps]);

          const calculateProgress = () => {
            let totalTasks = 0;
            let completedTasks = 0;
            steps.forEach(step => {
              step.tasks.forEach(task => {
                totalTasks++;
                if (task.completed) completedTasks++;
              });
            });
            setProgress(Math.round((completedTasks / totalTasks) * 100));
          };

          // --- Handlers ---

          const toggleTask = (stepIndex, taskIndex) => {
            const newSteps = [...steps];
            newSteps[stepIndex].tasks[taskIndex].completed = !newSteps[stepIndex].tasks[taskIndex].completed;
            setSteps(newSteps);
          };

          const updateNote = (stepIndex, noteText) => {
            const newSteps = [...steps];
            newSteps[stepIndex].note = noteText;
            setSteps(newSteps);
          };

          const resetData = () => {
            if(confirm("Start a new cook? This will clear all your progress.")) {
              setSteps(initialSteps);
              localStorage.removeItem('dakotaSmokeData');
              setProgress(0);
            }
          };

          // --- Components ---

          const Timer = ({ duration, label }) => {
            const [timeLeft, setTimeLeft] = useState(duration);
            const [isActive, setIsActive] = useState(false);
            const intervalRef = useRef(null);

            useEffect(() => {
              return () => clearInterval(intervalRef.current);
            }, []);

            const toggleTimer = () => {
              if (isActive) {
                clearInterval(intervalRef.current);
                setIsActive(false);
              } else {
                setIsActive(true);
                intervalRef.current = setInterval(() => {
                  setTimeLeft((prev) => {
                    if (prev <= 1) {
                      clearInterval(intervalRef.current);
                      setIsActive(false);
                      return 0;
                    }
                    return prev - 1;
                  });
                }, 1000);
              }
            };

            const resetTimer = () => {
              clearInterval(intervalRef.current);
              setIsActive(false);
              setTimeLeft(duration);
            };

            const formatTime = (seconds) => {
              const mins = Math.floor(seconds / 60);
              const secs = seconds % 60;
              return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            return (
              <div className="mt-3 p-4 bg-stone-900 rounded-lg border border-stone-700 flex flex-col items-center">
                <span className="text-stone-400 text-xs font-bold uppercase tracking-widest mb-1">{label}</span>
                <div className="text-4xl font-mono text-amber-500 mb-3 tabular-nums">
                  {formatTime(timeLeft)}
                </div>
                <div className="flex gap-2">
                  <button 
                    onClick={toggleTimer}
                    className={`px-4 py-1.5 rounded-full text-sm font-semibold transition-colors ${
                      isActive 
                        ? 'bg-red-900/50 text-red-200 border border-red-700 hover:bg-red-900' 
                        : 'bg-emerald-900/50 text-emerald-200 border border-emerald-700 hover:bg-emerald-900'
                    }`}
                  >
                    {isActive ? 'Pause' : 'Start'}
                  </button>
                  <button 
                    onClick={resetTimer}
                    className="px-4 py-1.5 rounded-full text-sm font-semibold bg-stone-800 text-stone-400 border border-stone-700 hover:bg-stone-700 transition-colors"
                  >
                    Reset
                  </button>
                </div>
              </div>
            );
          };

          return (
            <div className="min-h-screen bg-[#1a1917] text-stone-200 font-sans selection:bg-amber-900 selection:text-white pb-20">
              
              {/* Background Ambience */}
              <div className="fixed inset-0 z-0 opacity-20 pointer-events-none" 
                   style={{
                     backgroundImage: `radial-gradient(circle at 50% 0%, #C25E00 0%, transparent 40%), radial-gradient(circle at 90% 90%, #1A3C34 0%, transparent 40%)`
                   }}>
              </div>

              {/* Header */}
              <header className="relative z-10 bg-[#1a1917]/80 backdrop-blur-md border-b border-stone-800 sticky top-0">
                <div className="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
                  <div className="flex items-center gap-3">
                    <div className="p-2 bg-gradient-to-br from-amber-600 to-orange-800 rounded-lg shadow-lg shadow-orange-900/20">
                      <Mountain className="text-white w-6 h-6" />
                    </div>
                    <div>
                      <h1 className="text-xl font-bold tracking-tight text-white font-serif">DAKOTA SMOKE</h1>
                      <p className="text-xs text-amber-500 font-medium tracking-widest uppercase">Traeger Century 885 Edition</p>
                    </div>
                  </div>
                  
                  <div className="flex items-center gap-4">
                    <div className="text-right hidden sm:block">
                      <div className="text-xs text-stone-500 font-bold uppercase tracking-wider">Progress</div>
                      <div className="text-lg font-mono text-emerald-500">{progress}%</div>
                    </div>
                    <button onClick={resetData} className="p-2 text-stone-500 hover:text-red-400 transition-colors" title="Reset Guide">
                      <Trash2 className="w-5 h-5" />
                    </button>
                  </div>
                </div>
                {/* Mobile Progress Bar */}
                <div className="h-1 bg-stone-800 w-full">
                  <div className="h-full bg-gradient-to-r from-amber-600 to-emerald-600 transition-all duration-500" style={{width: `${progress}%`}}></div>
                </div>
              </header>

              {/* Main Content */}
              <main className="relative z-10 max-w-3xl mx-auto px-4 py-6 space-y-8">
                
                {/* Intro Card */}
                <div className="p-6 rounded-2xl bg-stone-900/50 border border-stone-800 backdrop-blur-sm">
                  <div className="flex items-start gap-4">
                    <div className="p-3 bg-stone-800 rounded-xl hidden sm:block">
                      <Utensils className="w-6 h-6 text-stone-400" />
                    </div>
                    <div>
                      <h2 className="text-lg font-bold text-white mb-2 font-serif">The "Smoke & Roast" Strategy</h2>
                      <p className="text-stone-400 text-sm leading-relaxed">
                        Using your specific ingredients (Tone's Italian & Colavita) and the Century 885, we tackle rubbery skin by starting low for flavor, then blasting high heat for texture.
                      </p>
                      
                      {/* Quick Ingredients Badge List */}
                      <div className="flex flex-wrap gap-2 mt-4">
                        <span className="px-2 py-1 bg-stone-800 border border-stone-700 rounded text-xs text-stone-300">Tone's Italian Seasoning</span>
                        <span className="px-2 py-1 bg-stone-800 border border-stone-700 rounded text-xs text-stone-300">Sea Salt</span>
                        <span className="px-2 py-1 bg-stone-800 border border-stone-700 rounded text-xs text-stone-300">Colavita Olive Oil</span>
                        <span className="px-2 py-1 bg-amber-900/30 border border-amber-800/50 rounded text-xs text-amber-500">Fruit/Hickory Pellets</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Steps */}
                <div className="space-y-6">
                  {steps.map((step, stepIndex) => (
                    <div key={step.id} className="group relative">
                      {/* Step Connector Line */}
                      {stepIndex !== steps.length - 1 && (
                        <div className="absolute left-6 top-16 bottom-[-24px] w-0.5 bg-stone-800 group-hover:bg-stone-700 transition-colors z-0"></div>
                      )}

                      <div className="relative z-10 bg-stone-900/80 border border-stone-800 rounded-2xl overflow-hidden shadow-xl transition-all hover:border-stone-700">
                        
                        {/* Step Header */}
                        <div className={`px-6 py-4 bg-gradient-to-r ${step.color} bg-opacity-10 border-b border-white/5`}>
                          <div className="flex items-center gap-4">
                            <div className="p-2 bg-black/20 rounded-lg backdrop-blur-sm text-white shadow-inner">
                              {iconMap[step.iconKey]}
                            </div>
                            <div className="flex-1">
                              <h3 className="text-lg font-bold text-white font-serif">{step.title}</h3>
                              <p className="text-sm text-white/70 font-medium">{step.subtitle}</p>
                            </div>
                            <div className="text-xs font-bold px-2 py-1 rounded bg-black/20 text-white/80 border border-white/10">
                              STEP 0{step.id}
                            </div>
                          </div>
                        </div>

                        {/* Step Content */}
                        <div className="p-6">
                          <div className="space-y-4">
                            {step.tasks.map((task, taskIndex) => (
                              <div key={task.id} className="space-y-3">
                                <div 
                                  onClick={() => toggleTask(stepIndex, taskIndex)}
                                  className={`flex items-start gap-4 p-3 rounded-xl cursor-pointer transition-all duration-200 border ${
                                    task.completed 
                                      ? 'bg-emerald-900/10 border-emerald-900/30' 
                                      : 'bg-stone-800/30 border-transparent hover:bg-stone-800'
                                  }`}
                                >
                                  <div className={`mt-0.5 flex-shrink-0 transition-colors ${task.completed ? 'text-emerald-500' : 'text-stone-600'}`}>
                                    {task.completed ? <CheckCircle2 className="w-6 h-6" /> : <Circle className="w-6 h-6" />}
                                  </div>
                                  <span className={`text-sm sm:text-base leading-relaxed transition-all ${
                                    task.completed ? 'text-stone-500 line-through decoration-stone-700' : 'text-stone-200'
                                  }`}>
                                    {task.text}
                                  </span>
                                </div>
                                
                                {/* Integrated Timer for specific tasks */}
                                {task.hasTimer && !task.completed && (
                                  <div className="ml-10">
                                    <Timer duration={task.duration} label={task.text.split(':')[0]} />
                                  </div>
                                )}
                              </div>
                            ))}
                          </div>

                          {/* Notes Section */}
                          <div className="mt-6 pt-6 border-t border-stone-800">
                            <div className="flex items-center gap-2 mb-2 text-stone-500">
                              <Edit3 className="w-4 h-4" />
                              <span className="text-xs font-bold uppercase tracking-wider">Chef's Notes</span>
                            </div>
                            <textarea
                              value={step.note}
                              onChange={(e) => updateNote(stepIndex, e.target.value)}
                              placeholder={`Log details for Step ${step.id} (e.g., "Temp settled at 230", "Used Apple pellets")...`}
                              className="w-full bg-black/20 border border-stone-800 rounded-lg p-3 text-sm text-stone-300 placeholder-stone-600 focus:outline-none focus:border-amber-700 focus:ring-1 focus:ring-amber-700 transition-all resize-y min-h-[80px]"
                            />
                          </div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Footer */}
                <div className="text-center py-12 text-stone-600">
                  <p className="text-xs uppercase tracking-widest mb-2">Designed for the 2026 Season</p>
                  <div className="flex justify-center items-center gap-2 opacity-50">
                    <div className="w-1 h-1 rounded-full bg-stone-500"></div>
                    <div className="w-1 h-1 rounded-full bg-stone-500"></div>
                    <div className="w-1 h-1 rounded-full bg-stone-500"></div>
                  </div>
                </div>

              </main>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DakotaSmokeApp />);
    </script>
</body>
</html>
